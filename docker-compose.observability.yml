services:
  prometheus:
    image: prom/prometheus:v3.2.1
    profiles: [observability]
    ports: ["127.0.0.1:9090:9090"]
    volumes:
      - ./docker/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
  grafana:
    image: grafana/grafana:11.6.0
    profiles: [observability]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports: ["127.0.0.1:3001:3000"]
    volumes:
      - ./docker/observability/datasources.yml:/etc/grafana/provisioning/datasources/coursepilot.yml:ro
      - ./docker/observability/dashboards.yml:/etc/grafana/provisioning/dashboards/coursepilot.yml:ro
      - ./docker/observability/coursepilot.json:/var/lib/grafana/dashboards/coursepilot.json:ro
    depends_on: [prometheus]
