name: coursepilot-eval-v2
x-environment: &environment
  AGENT_INTERNAL_SECRET: eval-only-secret-that-is-at-least-32-characters
  AGENT_JWT_ISSUER: learnhub-web
  AGENT_JWT_AUDIENCE: coursepilot-agent
  LLM_API_KEY: ollama
  LLM_BASE_URL: http://host.docker.internal:11434/v1
  LLM_MODEL: qwen3:8b
  LLM_TEMPERATURE: "0"
  LLM_DISABLE_THINKING: "true"
  LLM_MAX_TOKENS: "1024"
  LLM_TIMEOUT_SECONDS: "120"
  RUN_TIMEOUT_SECONDS: "180"
  RETRIEVAL_MODE: ${RETRIEVAL_MODE:-hybrid}
  UPLOADS_DIR: /data
  LOG_LEVEL: WARNING
  EVAL_USER_ID: eval-student-alpha
  EVAL_COURSE_ID: eval-course-web
  EVAL_FIXTURE_PROFILE: ${EVAL_FIXTURE_PROFILE:-regression-v1}
  EVAL_GIT_COMMIT: ${EVAL_GIT_COMMIT:-working-tree}
  EVAL_GPU_NAME: ${EVAL_GPU_NAME:-unknown}
  EVAL_GPU_MEMORY_MB: ${EVAL_GPU_MEMORY_MB:-unknown}
  EVAL_GPU_DRIVER: ${EVAL_GPU_DRIVER:-unknown}
services:
  eval-postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: coursepilot_eval
      POSTGRES_USER: coursepilot
      POSTGRES_PASSWORD: coursepilot
    volumes:
      - eval_database:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coursepilot -d coursepilot_eval"]
      interval: 3s
      timeout: 3s
      retries: 20
  eval-init:
    image: coursepilot-eval-v2
    build:
      context: .
      args:
        INSTALL_DEV: "true"
    environment:
      <<: *environment
      DATABASE_URL: postgresql+asyncpg://coursepilot:coursepilot@eval-postgres:5432/coursepilot_eval
      ALLOW_EVAL_RESET: "1"
      AGENT_DB_PASSWORD: eval-runtime-only
    volumes:
      - ./evals:/app/evals:ro
      - eval_documents:/data
    command: ["sh", "-c", "alembic upgrade head && python -m evals.seed --reset && python -m app.bootstrap"]
    depends_on:
      eval-postgres:
        condition: service_healthy
  eval-agent:
    image: coursepilot-eval-v2
    environment:
      <<: *environment
      DATABASE_URL: postgresql+asyncpg://coursepilot_agent:eval-runtime-only@eval-postgres:5432/coursepilot_eval
      CHECKPOINT_DATABASE_URL: postgresql://coursepilot_agent:eval-runtime-only@eval-postgres:5432/coursepilot_eval?options=-csearch_path%3Dagent%2Cpublic
      CHECKPOINT_SETUP: "false"
    ports:
      - "127.0.0.1:8001:8000"
    volumes:
      - ./evals:/app/evals:ro
      - ./evals/artifacts:/app/evals/artifacts
      - ./tests:/app/tests:ro
      - eval_documents:/data:ro
    depends_on:
      eval-init:
        condition: service_completed_successfully
volumes:
  eval_database:
  eval_documents:
